<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="leaflet.css" />
    <!-- .js yerine .txt olarak çağırıyoruz -->
    <script src="leaflet_js.txt"></script>
    <style>
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			background-color: #e5e3df;
		}
		#map {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body>
    <div id="map"></div>
    <script type="text/javascript">
        var map = null;
        var marker = null;

        function initMap() {
			if (map !== null) return;

			// CSS yüzde değerlerini boşverip, ekran boyutunu piksel olarak dayatıyoruz
			var mapDiv = document.getElementById('map');
			mapDiv.style.height = window.innerHeight + "px";
			mapDiv.style.width = window.innerWidth + "px";

			map = L.map('map', {
				zoomControl: true,
				attributionControl: false
			}).setView([0, 0], 2);

			L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
				maxZoom: 18
			}).addTo(map);
		}

        function setLocation(lat, lng) {
            if (map === null) {
                initMap();
            }

            var coords = [lat, lng];
            map.setView(coords, 16);

            if (marker) {
                marker.setLatLng(coords);
            } else {
                marker = L.marker(coords).addTo(map);
            }

            // BB10 WebKit render gecikmesini aşmak için boyut yenileme
            setTimeout(function() {
                map.invalidateSize();
            }, 300);
        }

        window.onload = initMap;
    </script>
</body>
</html>
